<!DOCTYPE html>
<html>
<head>
    <title>Mail SignUp Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #83caed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            width: 450px;
            background-color: white;
            text-align: center;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 28px;
        }

        label {
            display: block;
            text-align: left;
            margin: 12px 0 6px;
            color: #34495e;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h1>Sign Up for DEV@Deakin</h1>

        <form action="/" method="post">

            <label>First Name</label>
            <input name="first" type="text" placeholder="Enter first name" required>

            <label>Last Name</label>
            <input name="last" type="text" placeholder="Enter last name" required>

            <label>Email</label>
            <input name="email" type="email" placeholder="Enter email address" required>

            <button name="submit" type="submit">Sign Up</button>

        </form>

    </div>

</body>
</html>
