<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>BMI Calculator</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
            @theme {
        --color-clifford: #da373d;
        --color-mycolor:rgb(59 130 246 / .5);
      }
    </style>
    </head>
    <body align="center">
        <div class="bg-orange-300 space-y-2 text-center m-4 p-2 border-2 border-black rounded-4xl" >
        <h1 class="text-2xl text-shadow-md text-shadow-indigo-300">What is my BMI? Calculate your Body Mass Index below:</h1>
        <label for="height" class="pt-6">Please enter your height (cm):</label>
        <br>
        <input type="number" id="height" placeholder="Enter your height " class="border-2 border-black p-2 rounded-lg bg-gray-300 hover:bg-gray-500">
        <br>
        <label for="weight" class="pt-6">Please enter your weight (kg):</label>
        <br>
        <input type="number" id="weight" placeholder="Enter your weight " class="border-2 border-black p-2 rounded-lg bg-gray-300 hover:bg-gray-500 ">
        <br>
        <button class="bg-emerald-500 hover:bg-mycolor text-white font-bold py-2 px-4 rounded m-2 border-2 border-gray-200" onclick="calculateBMI()">Calculate BMI</button>
        <br>
        <p id="mybutton" class="text-red-400 text-xl"></p>
        <p id="message" class="text-red-400 text-xl"></p>
    </div>
        <!--[if lt IE 7]>

    </body>
</html>
